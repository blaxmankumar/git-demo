<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Git Zero to Hero</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #5f9cff, #7b5cff);
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 15px;
      text-align: center;
      width: 350px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
    }

    h1 span {
      color: #5f9cff;
    }

    p {
      color: #666;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .btn {
      background: #5f9cff;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 25px;
      font-size: 14px;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background: #4a7de0;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Welcome to <span>Git Zero to dev</span></h1>
    <p>Learn Git step by step and become confident with version control.</p>
    <button class="btn">Get Started 🚀</button>
  </div>

</body>
</html>
